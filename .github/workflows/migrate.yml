name: Migrar base de datos (producción)

on:
  push:
    branches: [main]
    paths:
      - 'drizzle/**'
      - 'src/db/schema.ts'
      - 'drizzle.config.ts'
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: drizzle-kit migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Usa la conexión directa (sin "-pooler" en el host) para migrar.
      - name: Aplicar migraciones
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
